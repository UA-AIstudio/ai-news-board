name: Deploy

# Publishes two pages on one GitHub Pages site:
#   /      the live board, built from main
#   /dev/  a preview of the open news update, built from claude/dev (if it exists)
# Both are built with main's scripts and template; only the data comes from claude/dev.

on:
  push:
    branches: [main, claude/dev]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v7
        with:
          ref: main
          path: main

      - name: Look for claude/dev
        id: dev
        working-directory: main
        run: |
          if git ls-remote --exit-code --heads origin claude/dev > /dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "No claude/dev branch, deploying main only."
          fi

      - name: Check out claude/dev
        if: steps.dev.outputs.exists == 'true'
        uses: actions/checkout@v7
        with:
          ref: claude/dev
          path: dev

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: main/requirements.txt

      - name: Install requirements
        run: pip install -r main/requirements.txt

      - name: Validate main
        run: python main/scripts/validate.py

      - name: Build main into site/
        run: python main/scripts/build.py --out site

      - name: Validate and build claude/dev into site/dev/
        if: steps.dev.outputs.exists == 'true'
        run: |
          if python main/scripts/validate.py --news dev/data/news.json --pinned dev/data/pinned.json \
            && python main/scripts/build.py --preview --data-dir dev/data --out site/dev; then
            echo "Built the dev preview at site/dev/."
          else
            rm -rf site/dev
            echo "::warning title=Dev preview skipped::claude/dev failed validation or build. Deploying main only; /dev/ will not be published."
          fi

      - name: Confirm pages exist
        run: |
          test -s site/index.html
          ls -R site

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site/

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
