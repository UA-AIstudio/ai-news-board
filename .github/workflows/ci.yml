name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          # Full history so the Routine check can diff against the base branch.
          fetch-depth: 0

      # Only people add or change images. Checked first, so this failure is
      # reported on its own.
      - name: Check claude/ branch does not touch static/img/
        if: startsWith(github.head_ref, 'claude/')
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          changed=$(git diff --name-only "origin/$BASE_REF...HEAD" -- static/img/)
          if [ -n "$changed" ]; then
            echo "::error title=Images are added by people only::A claude/ branch changed files under static/img/"
            echo "$changed"
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install requirements
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -q

      - name: Validate news data
        run: python scripts/validate.py

      - name: Build page
        run: python scripts/build.py

      - name: Confirm page exists
        run: test -s site/index.html

      # Covers the Routine's claude/dev branch and any other claude/ branch.
      - name: Check Routine pull request only changes data/news.json
        if: startsWith(github.head_ref, 'claude/')
        run: python scripts/validate.py --routine-pr "origin/${{ github.base_ref }}"
